name: smoke-tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore test project dependencies
        run: dotnet restore ./LlamaFleece.Tests/LlamaFleece.Tests.csproj

      - name: Run integration smoke subset
        run: >-
          dotnet test ./LlamaFleece.Tests/LlamaFleece.Tests.csproj
          --configuration Release
          --no-restore
          --filter "FullyQualifiedName~ResponsesApiIntegrationTests|FullyQualifiedName~AnthropicMessagesIntegrationTests"